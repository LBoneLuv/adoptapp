<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arko</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #6750a4;
        font-family: -apple-system, system-ui, sans-serif;
        color: #fff;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Pantalla de respaldo: Capacitor carga la web real desde server.url.
         Esto solo se ve si no hay conexión. -->
    <div class="wrap">
      <div class="spinner"></div>
      <p>Cargando Arko…</p>
    </div>
  </body>
</html>
